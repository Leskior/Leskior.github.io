<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UST 随机生成器 (内置歌词库)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>🎵 UST 随机生成器 (内置歌词库)</h1>

    <!-- 歌词库选择 -->
    <div class="section">
        <div class="section-title">🗣️ 歌词库选择</div>
        <div class="param-row">
            <span class="param-label">当前歌词库:</span>
            <div class="param-input">
                <select id="lyricLibSelect">
                    <option value="pinyin" selected>中文拼音 (完整音节)</option>
                    <option value="hiragana">日文平假名/拗音</option>
                </select>
                <span style="font-size:0.85em; color:#666;" id="libCount">共 413 个音节</span>
            </div>
        </div>
    </div>

    <!-- 参数设置 -->
    <div class="section">
        <div class="section-title">⚙️ 参数设置</div>

        <div class="param-row">
            <span class="param-label">最短音符长度 (四分音符480):</span>
            <div class="param-input">
                <input type="range" id="shortestNote" min="1" max="960" value="240" step="1">
                <span class="param-value" id="shortestVal">240</span>
            </div>
        </div>

        <div class="param-row">
            <span class="param-label">最长音符长度 (四分音符480):</span>
            <div class="param-input">
                <input type="range" id="longestNote" min="1" max="1920" value="960" step="1">
                <span class="param-value" id="longestVal">960</span>
            </div>
        </div>

        <div class="param-row">
            <span class="param-label">最低音:</span>
            <div class="param-input">
                <input type="range" id="lowestNote" min="24" max="108" value="60" step="1">
                <span class="param-value" id="lowestVal">C4</span>
            </div>
        </div>

        <div class="param-row">
            <span class="param-label">最高音:</span>
            <div class="param-input">
                <input type="range" id="highestNote" min="24" max="108" value="84" step="1">
                <span class="param-value" id="highestVal">C6</span>
            </div>
        </div>

        <div class="param-row">
            <span class="param-label">平滑参数:</span>
            <div class="param-input" style="gap:25px;">
                <label class="checkbox-label">
                    <input type="checkbox" id="smoothPitch" checked> 平滑音高
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="smoothLength" checked> 平滑音符长度
                </label>
            </div>
        </div>

        <div class="param-row">
            <span class="param-label">BPM:</span>
            <div class="param-input">
                <input type="range" id="bpm" min="30" max="240" value="120" step="1">
                <span class="param-value" id="bpmVal">120</span>
            </div>
        </div>

        <div class="param-row">
            <span class="param-label">音符数量:</span>
            <div class="param-input">
                <input type="range" id="noteCount" min="1" max="9999" value="16" step="1">
                <span class="param-value" id="noteCountVal">16</span>
            </div>
        </div>

        <div class="param-row">
            <span class="param-label">每多少秒插入停顿:</span>
            <div class="param-input">
                <input type="range" id="pauseInterval" min="1" max="30" value="10" step="0.1">
                <span class="param-value" id="pauseIntervalVal">10.0</span>
            </div>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 15px;">
        <button class="btn" id="generateBtn">🎼 生成 UST 文件</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 恢复默认</button>
    </div>

    <div class="status" id="statusBar">就绪</div>
    <div class="download-links" id="downloadLinks" style="display:none;"></div>
</div>

<script src="script.js"></script>
</body>
</html>
